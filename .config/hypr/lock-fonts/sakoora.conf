# Sakoora — la tipografía de pinkSakoora/sakoora.hyprlock (style-1): Josefin Sans para el texto, Fira Code Nerd Font Mono para los datos y Fira Code Nerd Font para los iconos
# descarga: josefin-sans https://github.com/google/fonts/raw/main/ofl/josefinsans/JosefinSans%5Bwght%5D.ttf https://github.com/google/fonts/raw/main/ofl/josefinsans/JosefinSans-Italic%5Bwght%5D.ttf https://github.com/google/fonts/raw/main/ofl/josefinsans/OFL.txt
# (Las Fira Code Nerd Font vienen de ttf-firacode-nerd, en packages.txt.) Roles: ver jetbrains.conf.

$lock_font_clock = Josefin Sans SemiBold
$lock_font_day   = Josefin Sans
$lock_font_temp  = Josefin Sans
$lock_font_title = FiraCode Nerd Font Mono
$lock_font_text  = Josefin Sans
$lock_font_data  = FiraCode Nerd Font Mono
$lock_font_icons = FiraCode Nerd Font      # sin "Mono": con la variante Mono los iconos se encogen a una celda

$lock_size_clock  = 132
$lock_size_day    = 18
$lock_size_temp   = 56
$lock_size_pct    = 38
$lock_size_title  = 16
$lock_size_text   = 17
$lock_size_artist = 16
$lock_size_data   = 12

$lock_pad = 1.5   # Josefin Sans: la tilde de una mayúscula (MIÉRCOLES, Édith) sobresale de la caja y se recorta
