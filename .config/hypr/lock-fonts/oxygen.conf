# Oxygen Mono — la monoespaciada del proyecto Oxygen de KDE (Google Fonts, OFL); los iconos siguen en JetBrains Mono Nerd Font
# descarga: oxygen-mono https://github.com/google/fonts/raw/main/ofl/oxygenmono/OxygenMono-Regular.ttf https://github.com/google/fonts/raw/main/ofl/oxygenmono/OFL.txt
# Oxygen Mono solo trae el peso normal, y no es una Nerd Font: por eso los iconos usan otra. Roles: ver jetbrains.conf.

$lock_font_clock = Oxygen Mono
$lock_font_day   = Oxygen Mono
$lock_font_temp  = Oxygen Mono
$lock_font_title = Oxygen Mono
$lock_font_text  = Oxygen Mono
$lock_font_data  = Oxygen Mono
$lock_font_icons = JetBrainsMono NF

$lock_size_clock  = 104
$lock_size_day    = 15
$lock_size_temp   = 50
$lock_size_pct    = 34
$lock_size_title  = 16
$lock_size_text   = 15
$lock_size_artist = 14
$lock_size_data   = 12

$lock_pad = 0
