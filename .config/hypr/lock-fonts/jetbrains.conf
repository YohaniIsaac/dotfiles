# JetBrains Mono — la tipografía de la barra y la terminal; la que tenía la pantalla de bloqueo y su base de respaldo
#
# Un preset define, para cada texto de hyprlock.conf, la familia ($lock_font_*) y el tamaño en
# PUNTOS ($lock_size_*; 1 pt = 1,33 px). Roles: clock = la hora grande (hora y minutos, apilados;
# aquí va el peso: "… Medium", "… SemiBold") · day = la fecha · temp = temperatura y porcentaje de
# la batería · title = título de la canción · text = clima, artista y estado de la batería · data =
# mínima/máxima y reproductor · icons = iconos (tiene que ser una Nerd Font). $lock_pad = relleno de
# línea (line_height) del título y el artista de la canción: 0 = ninguno; hay que subirlo si la
# fuente recorta las tildes de las mayúsculas. Una familia con peso en el nombre ("Josefin Sans
# SemiBold") funciona; ojo: hyprlock comparte la textura de dos etiquetas con el mismo texto,
# tamaño y color aunque la fuente sea distinta (solo importa al probar fuentes lado a lado).
# Líneas "# descarga: <carpeta> <url> <url>…" (una por fuente): las baja lock-font.sh a
# ~/.local/share/fonts/<carpeta>/. Esta viene de un paquete (ttf-jetbrains-mono-nerd, en packages.txt).

$lock_font_clock = JetBrainsMono NF Medium
$lock_font_day   = JetBrainsMono NF Medium
$lock_font_temp  = JetBrainsMono NF Light
$lock_font_title = JetBrainsMono NF Medium
$lock_font_text  = JetBrainsMono NF
$lock_font_data  = JetBrainsMono NF
$lock_font_icons = JetBrainsMono NF

$lock_size_clock  = 104
$lock_size_day    = 15
$lock_size_temp   = 50
$lock_size_pct    = 34
$lock_size_title  = 17
$lock_size_text   = 15
$lock_size_artist = 14
$lock_size_data   = 12

$lock_pad = 0
