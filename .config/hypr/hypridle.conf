# lock_cmd pasa por lock.sh y no por `pidof hyprlock || hyprlock` (la receta de la wiki): hyprlock
# 0.9.6 a veces no sale al desbloquear, y ese zombi hacía que pidof siempre dijera "ya hay uno"
# y el bloqueo por inactividad no se lanzara (desde el 2026-09-09 hasta el 2026-10-01). lock.sh
# pregunta al compositor (`hyprctl locked`) y elimina los zombis; ver su cabecera.
general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock screen after 15 minutes
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn off screens after 30 minutes
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 1 hour — DESACTIVADO 2026-07-06 (definitivo).
# `systemctl suspend` en este equipo cuelga en s2idle y NUNCA resume (PROBADO 2 veces:
# 2-jul y de nuevo el fin de semana 3→6 jul, con microcode/cstate/aspm YA aplicados — el
# cuelgue de suspend es independiente de esos fixes). El equipo siempre está enchufado,
# así que no hace falta auto-suspender. Reactivar SOLO si se soluciona el bug de s2idle
# (BIOS update / kernel LTS) y se prueba explícitamente.
