# -----------------------------------------------------
# Misc Configuration
# -----------------------------------------------------

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false

    # Si el bloqueador muere con la sesión bloqueada (pantalla "lockscreen app died"), permite que un
    # hyprlock nuevo tome el relevo. Recuperación desde otro TTY (Ctrl+Alt+F3):
    #   hyprctl --instance 0 dispatch exec ~/.config/hypr/scripts/lock.sh
    allow_session_lock_restore = true
}
