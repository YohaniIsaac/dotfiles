# -----------------------------------------------------
# Autostart Configuration
# -----------------------------------------------------

# Waybar — reemplazada por la barra de AGS (ver más abajo).
# Para volver a waybar: descomentar esta línea y comentar la de "ags run".
# exec-once = waybar

# Wallpaper daemon + restaurar fondo
exec-once = awww-daemon && awww img ~/Pictures/wallpapers/lofirain.png

# Notification daemon
exec-once = swaync

# Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Idle daemon
exec-once = hypridle

# AGS — barra inferior + calendario + media player de Spotify.
# (calendario se togglea con SUPER+CTRL+C — ver keybindings.conf)
exec-once = ags run ~/.config/ags

# Clipboard history
exec-once = wl-paste --watch cliphist store

# Inicializar workspaces en los monitores correctos
exec-once = ~/.config/hypr/scripts/init-workspaces.sh
