# -----------------------------------------------------
# Autostart Configuration
# -----------------------------------------------------

# Lo propio de esta máquina que no está en git, si falta: host.conf y colores por
# defecto (va primero: la barra de AGS no compila sin ags/colors.scss)
exec-once = ~/.config/hypr/scripts/machine-setup.sh

# Wallpaper daemon + último fondo elegido con Super+W (groot_1.jpg en una instalación nueva)
exec-once = ~/.config/hypr/scripts/restore-wallpaper.sh

# Notification daemon
exec-once = swaync

# Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Idle daemon
exec-once = hypridle

# El bloqueo baja el brillo de la laptop y de los monitores con DDC/CI (scripts/lock-dim.sh). Si el
# equipo se apagó o Hyprland murió con la sesión bloqueada, el nivel bajo se restaura en el arranque
# (la laptop) o se queda en el monitor: esto devuelve lo guardado, y reintenta hasta 20 s a un
# monitor que aún no responde. Sin nada guardado no hace nada.
exec-once = ~/.config/hypr/scripts/lock-dim.sh restore - 20

# AGS — REACTIVADO 2026-07-07: el test de aislamiento (2-7 jul) confirmó que AGS no
# causa los apagones (crasheó igual estando en waybar, sin AGS corriendo). NO lanzar
# `ags run` directo: en frío se adelanta a pipewire/wireplumber. Ver start-bar.sh.
exec-once = ~/.config/hypr/scripts/start-bar.sh

# Clipboard history
exec-once = wl-paste --watch cliphist store

# Inicializar workspaces en los monitores correctos
exec-once = ~/.config/hypr/scripts/init-workspaces.sh
