# -----------------------------------------------------
# Monitors Configuration — yt-home
# -----------------------------------------------------
# Temporal (rama yt-home) hasta unificar en un monitors.conf común + hosts/.
# Las pantallas externas se identifican por EDID (desc:), no por puerto.
# desc: debe coincidir con el INICIO de la descripción de `hyprctl monitors`.

# eDP-1 (laptop, EDO LEN151WQXGA 2560x1600@165) - a la derecha del KTC
# (x = ancho lógico del KTC = 2560)
monitor = eDP-1, preferred, 2560x0, 1.6

# KTC MGMG3240CQ - nativo 2560x1440 @ 144 Hz, a la izquierda
monitor = desc:Shenzhen KTC Technology Group MGMG3240CQ, 2560x1440@144, 0x0, 1

# Cualquier otra pantalla (TV, proyector): su modo preferido
monitor = , preferred, auto, 1
