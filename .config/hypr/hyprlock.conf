# -----------------------------------------------------
# Hyprlock — pantalla de bloqueo
# -----------------------------------------------------
# Solo información (hora, fecha, clima, reproductor y batería) en tarjetas translúcidas sobre el
# mismo wallpaper del escritorio, desenfocado. El campo de contraseña está oculto y aparece al
# empezar a teclear (fade_on_empty). Ideas de diseño, todas de repos GPL-3.0 (aquí no hay código
# suyo): las tarjetas y el bloque de la batería, de pinkSakoora/sakoora.hyprlock (style-1); la hora
# grande apilada en dos colores y la fecha en dos colores, de MrVivekRajan/Hyprlock-Styles
# (style-7 y style-8).
#
# Quién la usa: scripts/lock.sh (atajo, hypridle, botón de apagado de la barra), que antes llama a
# scripts/lock-info.sh prepare y deja en ~/.cache/hyprlock:
#   wallpaper    → enlace al wallpaper actual (~/.current_wallpaper)
#   avatar.png   → ~/.face recortado en cuadrado; sin ~/.face, una imagen transparente (y se ve el
#                  icono de reserva de debajo). Para poner tu foto: guárdala como ~/.face.
# y lock.sh llama además a scripts/lock-dim.sh overlay, que escribe dim-overlay.conf (ver el final).
# Los textos dinámicos (hora, fecha, clima, reproductor, batería) los da lock-info.sh; los comandos
# de cmd[...] tienen que terminar (hyprlock se cuelga con los que no).
#
# Colores: los de Matugen (colors.conf) y las variantes con transparencia $lock_* que genera la
# plantilla matugen/templates/hypr-colors.conf (hyprlang no puede aplicar alfa a una variable).
# Los números grandes (hora, minutos y fecha) tienen su propio color, abajo: cámbialos por
# cualquier variable de Matugen.
#
# Tipografía: ningún texto lleva la fuente escrita; usan $lock_font_<rol> y $lock_size_<rol>, que
# define un preset de hypr/lock-fonts/ (jetbrains, sakoora, oxygen…). Se cambia con
# `scripts/lock-font.sh <preset>`, que apunta el enlace hypr/lock-font.conf (por máquina, ignorado
# por git) al preset elegido; el de por defecto es sakoora. Se carga primero jetbrains como base de
# respaldo (viene de un paquete: siempre está instalada), por si el enlace faltara o un preset no
# definiera alguna variable.
#
# Trampas de hyprlock 0.9.x:
#   - Cada bloque, en varias líneas: hyprlang no entiende ";" ni bloques en una sola línea (el
#     bloque entero se descarta sin avisar y hyprlock no dibuja nada).
#   - font_size va en PUNTOS (1 pt = 1,33 px); size y position, en píxeles FÍSICOS del monitor:
#     0.9.6 no aplica la escala fraccionaria (medido: un cuadrado de 400 px mide 400 px con escala 1
#     y con 2). Las tres pantallas de yt-work son de 1920×1080, y el portátil (escala 1,25) se ve igual.
#   - `grace` ya no es una opción: es el flag --grace. Las opciones que no existen dan un error de
#     configuración en cada bloqueo.
#   - En position, y positiva = hacia arriba; se mide desde el centro de cada monitor.
#   - Dos etiquetas con el mismo texto, tamaño y color comparten textura aunque la fuente sea
#     distinta (la segunda sale con la fuente de la primera).
#   - Los colores llegan a un cmd[...] como rgba(rrggbbaa): hay que entrecomillarlos ('$variable').
#
# Rejilla (px desde el centro): dos columnas de 340 con 22 de separación y 634 de alto.
#   izquierda x=-181: hora y fecha (y 317…-71) y avatar (y -93…-317)
#   derecha   x=+181: clima (y 317…157), reproductor (y 135…-155) y batería (y -177…-317)
#   campo de contraseña: debajo, y=-361

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/lock-fonts/jetbrains.conf
source = ~/.config/hypr/lock-font.conf

# Colores de los números grandes y de la fecha
$lock_hour_color   = $on_surface           # hora
$lock_minute_color = $primary              # minutos
$lock_date_weekday = $on_surface_variant   # día de la semana
$lock_date_day     = $primary              # día y mes

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── Fondo: el wallpaper, borroso ─────────────────────────────────────────────
# Si el enlace no existe (máquina nueva antes del primer bloqueo por lock.sh) se usa `color`.
background {
    monitor =
    path = ~/.cache/hyprlock/wallpaper
    color = $surface
    # Con blur_passes = 2 y blur_size = 5 ya se distingue al astronauta: demasiado definido.
    blur_passes = 3
    blur_size = 6
    brightness = 1.5
    contrast = 1.25
    vibrancy = 0.7
    vibrancy_darkness = 0.2
}

# ── Tarjetas ─────────────────────────────────────────────────────────────────

# Hora y fecha
shape {
    monitor =
    size = 340, 388
    color = $lock_card
    rounding = 34
    border_size = 1
    border_color = $lock_card_border
    position = -181, 123
    halign = center
    valign = center
    zindex = 1
}
# Avatar
shape {
    monitor =
    size = 340, 224
    color = $lock_card
    rounding = 34
    border_size = 1
    border_color = $lock_card_border
    position = -181, -205
    halign = center
    valign = center
    zindex = 1
}
# Clima
shape {
    monitor =
    size = 340, 160
    color = $lock_card
    rounding = 34
    border_size = 1
    border_color = $lock_card_border
    position = 181, 237
    halign = center
    valign = center
    zindex = 1
}
# Reproductor
shape {
    monitor =
    size = 340, 290
    color = $lock_card
    rounding = 34
    border_size = 1
    border_color = $lock_card_border
    position = 181, -10
    halign = center
    valign = center
    zindex = 1
}
# Batería: la única tarjeta de color sólido (como la de style-1)
shape {
    monitor =
    size = 340, 140
    color = $primary
    rounding = 34
    border_size = 0
    position = 181, -247
    halign = center
    valign = center
    zindex = 1
}

# ── Hora ─────────────────────────────────────────────────────────────────────
# Hora y minutos son dos etiquetas, una encima de otra y algo desplazadas (style-7), cada una con su
# color. Tienen que ser dos: una sola etiqueta no admite dos posiciones. Llevan `date` directo y no
# lock-info.sh: se ejecutan cada segundo en cada pantalla y así cuestan la mitad de CPU.
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $lock_hour_color
    font_size = $lock_size_clock
    font_family = $lock_font_clock
    position = -215, 204
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $lock_minute_color
    font_size = $lock_size_clock
    font_family = $lock_font_clock
    position = -147, 72
    halign = center
    valign = center
    zindex = 2
}

# ── Fecha (siempre en inglés; el día de la semana y el resto, de dos colores como en style-8) ──
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh dateline '$lock_date_weekday' '$lock_date_day'
    color = $on_surface
    font_size = $lock_size_day
    font_family = $lock_font_day
    position = -181, -23
    halign = center
    valign = center
    zindex = 2
}

# ── Avatar ───────────────────────────────────────────────────────────────────
# Tres capas: disco con el anillo, icono de reserva y, encima, la foto (círculo). Sin ~/.face la
# foto es transparente y se ve el icono.
shape {
    monitor =
    size = 132, 132
    color = $primary_container
    rounding = -1
    border_size = 3
    border_color = $primary
    position = -181, -185
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    # glifo "account" de Nerd Font (U+F0004) en octal: printf de POSIX no entiende \x
    text = cmd[update:3600000] printf '\363\260\200\204'
    color = $primary
    font_size = 64
    font_family = $lock_font_icons
    position = -181, -185
    halign = center
    valign = center
    zindex = 3
}
image {
    monitor =
    path = ~/.cache/hyprlock/avatar.png
    size = 126
    rounding = -1
    border_size = 0
    position = -181, -185
    halign = center
    valign = center
    zindex = 4
}
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = $lock_size_text
    font_family = $lock_font_text
    position = -181, -276
    halign = center
    valign = center
    zindex = 2
}

# ── Clima (Open-Meteo; ubicación en ~/.config/hypr/weather.conf, local) ──────
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh w-icon
    color = $primary
    font_size = 54
    font_family = $lock_font_icons
    position = 133, 267
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh w-temp
    color = $on_surface
    font_size = $lock_size_temp
    font_family = $lock_font_temp
    position = 229, 267
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh w-desc
    color = $on_surface
    font_size = $lock_size_text
    font_family = $lock_font_text
    position = 181, 212
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh w-range
    color = $on_surface_variant
    font_size = $lock_size_data
    font_family = $lock_font_data
    position = 181, 186
    halign = center
    valign = center
    zindex = 2
}

# ── Reproductor (playerctl) ──────────────────────────────────────────────────
# La nota musical ocupa el sitio de la portada si no hay reproductor o aún no hay portada; la
# portada, que va encima (zindex), la tapa en cuanto llega.
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-info.sh p-idle
    color = $primary
    font_size = 72
    font_family = $lock_font_icons
    position = 181, 31
    halign = center
    valign = center
    zindex = 2
}
image {
    monitor =
    path = ~/.cache/hyprlock/transparent.png
    reload_cmd = ~/.config/hypr/scripts/lock-info.sh p-cover
    reload_time = 3
    size = 160
    rounding = 26
    border_size = 0
    position = 181, 31
    halign = center
    valign = center
    zindex = 3
}
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-info.sh p-title $lock_pad
    color = $on_surface
    font_size = $lock_size_title
    font_family = $lock_font_title
    position = 181, -78
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-info.sh p-artist $lock_pad
    color = $on_surface_variant
    font_size = $lock_size_artist
    font_family = $lock_font_text
    position = 181, -102
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock-info.sh p-meta
    color = $primary
    font_size = $lock_size_data
    font_family = $lock_font_data
    position = 181, -127
    halign = center
    valign = center
    zindex = 2
}

# ── Batería (sysfs) ──────────────────────────────────────────────────────────
# Una píldora oscura con diez segmentos y el icono del estado en el centro (rayo = cargando, enchufe
# = a la corriente, batería = descargando), el porcentaje y el estado. Con la batería baja y
# descargando (≤ 20 %) el relleno, el icono y el porcentaje pasan al color de error. La barra son
# espacios con fondo de color: necesita una fuente de ancho fijo ($lock_font_data) y 10 pt.
shape {
    monitor =
    size = 296, 28
    color = $surface
    rounding = -1
    border_size = 0
    position = 181, -210
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-info.sh batt-bar '$primary' '$surface_container_highest' '$error'
    color = $primary
    font_size = 10
    font_family = $lock_font_data
    position = 181, -210
    halign = center
    valign = center
    zindex = 3
}
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-info.sh batt-icon '$primary' '$error'
    color = $primary
    font_size = 22
    font_family = $lock_font_icons
    position = 181, -210
    halign = center
    valign = center
    zindex = 4
}
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-info.sh batt-pct '$on_primary' '$error_container'
    color = $on_primary
    font_size = $lock_size_pct
    font_family = $lock_font_temp
    position = 181, -257
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/lock-info.sh batt-status
    color = $on_primary
    font_size = $lock_size_text
    font_family = $lock_font_text
    position = 181, -293
    halign = center
    valign = center
    zindex = 2
}

# ── Contraseña: pequeña y oculta hasta que se teclea ─────────────────────────
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $lock_field
    font_color = $on_surface
    font_family = $lock_font_text
    check_color = $secondary
    fail_color = $error
    capslock_color = $tertiary
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Contraseña</i>
    hide_input = false
    rounding = -1
    position = 0, -361
    halign = center
    valign = center
    zindex = 5
}

# ── Brillo de los monitores sin DDC ──────────────────────────────────────────
# lock-dim.sh overlay escribe aquí, en cada bloqueo, un `shape` negro translúcido por cada monitor externo
# que no se puede atenuar por DDC/CI (zindex 9: por encima de todo, también del campo de contraseña), para
# que quede tan oscuro como los demás. Es solo visual: la retroiluminación no cambia. Vacío si no hay ninguno.
source = ~/.cache/hyprlock/dim-overlay.conf
