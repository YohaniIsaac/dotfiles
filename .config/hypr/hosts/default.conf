# -----------------------------------------------------
# Máquina sin archivo propio en hosts/
# -----------------------------------------------------
# Todo automático. Para darle su propia config: copia este archivo como
# hosts/<hostname>.conf y corre `~/.config/hypr/scripts/machine-setup.sh --force`.

monitor = , preferred, auto, auto

# Roles de monitor (ver yt-work.conf). Un rol sin monitor usa "none".
$mon1 = eDP-1
$mon2 = none
$mon3 = none
