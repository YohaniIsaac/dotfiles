# -----------------------------------------------------
# yt-work — laptop del trabajo + 2 monitores
# -----------------------------------------------------
# hyprland.conf lo carga a través de ~/.config/hypr/host.conf (symlink que crea
# scripts/machine-setup.sh según el hostname).

# DP-1 (SAC LED MONITOR) - arriba izquierda
monitor = DP-1, 1920x1080@74.97, 0x0, 1

# HDMI-A-1 (ASUS VA27EHF) - arriba derecha
monitor = HDMI-A-1, 1920x1080@100.05, 1920x1080, 1

# eDP-1 (laptop) - abajo del DP-1
monitor = eDP-1, preferred, 3840x2160, 1.25

# Roles de monitor: cada uno tiene su bloque de 10 workspaces (workspace.conf)
# y su atajo Super+F1/F2/F3 (custom.conf).
# Monitor 1 (principal): workspaces 1–10
$mon1 = DP-1
# Monitor 2: workspaces 11–20
$mon2 = HDMI-A-1
# Monitor 3: workspaces 21–30
$mon3 = eDP-1
