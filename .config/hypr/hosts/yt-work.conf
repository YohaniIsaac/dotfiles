# -----------------------------------------------------
# yt-work — laptop del trabajo + 2 monitores
# -----------------------------------------------------
# hyprland.conf lo carga a través de ~/.config/hypr/host.conf (symlink que crea
# scripts/machine-setup.sh según el hostname).
#
# Los nombres de conector (DP-1, HDMI-A-1) cambian si se cambian los cables de
# entrada: tras moverlos, comprueba con `hyprctl monitors` cuál es cuál (el modelo
# sale en "description") y ajusta este archivo.
#
# Disposición en escalera, de izquierda a derecha: laptop → SAC LED MONITOR → ASUS VA27EHF.
# Cada monitor toca al anterior SOLO por la esquina: su esquina superior izquierda queda
# sobre la esquina inferior derecha del anterior. Es a propósito: así el cursor no pasa de
# una pantalla a otra por accidente (solo por la esquina); para cambiar de monitor se usa
# Super+F1/F2/F3. Para cambiar la posición, x e y del siguiente = x+ancho, y+alto del anterior.

# eDP-1 (laptop) - arriba a la izquierda. Con escala 1.25 mide 1536x864 px lógicos
# (1920/1.25 x 1080/1.25): de ahí salen la x y la y del SAC.
monitor = eDP-1, preferred, 0x0, 1.25

# HDMI-A-1 (SAC LED MONITOR) - su esquina superior izquierda toca la inferior derecha de la
# laptop (1536, 864). Su máximo es 75 Hz.
monitor = HDMI-A-1, 1920x1080@74.97, 1536x864, 1

# DP-1 (ASUS VA27EHF) - su esquina superior izquierda toca la inferior derecha del SAC
# (1536+1920, 864+1080). Llega a 100 Hz.
monitor = DP-1, 1920x1080@100.05, 3456x1944, 1

# Roles de monitor: cada uno tiene su bloque de 10 workspaces (workspace.conf)
# y su atajo Super+F1/F2/F3 (custom.conf).
# Monitor 1 (principal, SAC): workspaces 1–10
$mon1 = HDMI-A-1
# Monitor 2 (ASUS): workspaces 11–20
$mon2 = DP-1
# Monitor 3 (laptop): workspaces 21–30
$mon3 = eDP-1
