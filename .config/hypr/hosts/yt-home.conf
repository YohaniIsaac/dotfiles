# -----------------------------------------------------
# yt-home — laptop de la casa + 1 monitor
# -----------------------------------------------------
# Plantilla inicial: la primera vez, revisa conectores, resolución y posición
# con `hyprctl monitors` y ajusta este archivo (el externo quizás no es HDMI-A-1).

# Laptop: resolución y escala automáticas
monitor = eDP-1, preferred, auto, auto

# Cualquier otro monitor (el externo): automático, a la derecha del laptop
monitor = , preferred, auto, 1

# Roles de monitor (ver yt-work.conf). Un rol sin monitor usa "none".
# Monitor 1 (principal, el externo): workspaces 1–10
$mon1 = HDMI-A-1
# Monitor 2 (laptop): workspaces 11–20
$mon2 = eDP-1
# Monitor 3: no hay
$mon3 = none
